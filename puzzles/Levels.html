<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>關卡列表</title>

<style>
:root{
    --bg:#070907;
    --line:#2b442b;
    --green:#6bff4d;
    --text:#f5f5f5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:sans-serif;
    color:var(--text);

    background:
        radial-gradient(circle at top left, rgba(107,255,77,.15), transparent 40%),
        radial-gradient(circle at bottom right, rgba(107,255,77,.1), transparent 40%),
        var(--bg);

    padding:40px;
}

/* HUD */
.hud{
    position:fixed;
    top:20px;
    right:20px;
    background:rgba(15,20,15,.9);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 16px;
    font-size:14px;
}

/* 區塊標題 */
.section-title{
    margin:20px 0 10px;
    font-size:18px;
    color:#cfcfcf;
}

/* grid */
.levels{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:15px;
    margin-bottom:20px;
}

/* button */
button{
    padding:15px;
    font-size:16px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    background:rgba(20,25,20,.9);
    border:1px solid var(--line);
    color:var(--text);
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:var(--green);
    color:#000;
    transform:translateY(-2px);
}

/* divider */
.divider{
    height:1px;
    background:#2b442b;
    margin:30px 0;
}

/* logout */
.logout{
    margin-top:40px;
    width:100%;
    background:#1a1f1a;
}

/* modal */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content{
    width:320px;
    background:#101410;
    border:1px solid var(--line);
    padding:20px;
    border-radius:12px;
}

.modal-content h2{
    margin-bottom:15px;
}

.modal-content input{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#151915;
    border:1px solid #334433;
    color:white;
    border-radius:8px;
}

.modal-content .btn-row{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.small-btn{
    flex:1;
    padding:10px;
    font-size:14px;
}
</style>
</head>

<body>

<!-- HUD -->
<div class="hud">
    <div>ID: <span id="username">---</span></div>
    <div>Day1：0/7</div>
    <div>Day2：0/9</div>
</div>

<h1>關卡選擇</h1>

<!-- DAY 1 -->
<div class="section-title">第一天</div>
<div class="levels" id="day1"></div>

<div class="divider"></div>

<!-- DAY 2 -->
<div class="section-title">第二天</div>
<div class="levels" id="day2"></div>

<!-- 登出 -->
<button class="logout" onclick="logout()">登出</button>

<!-- modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="modalTitle">關卡</h2>

        <button class="small-btn">下載</button>

        <input placeholder="輸入答案">

        <div class="btn-row">
            <button id="submitBtn" class="small-btn">Enter</button>
            <button class="small-btn" onclick="closeModal()">關閉</button>
        </div>
    </div>
</div>

<script>

const user = JSON.parse(localStorage.getItem("user") || "{}");

if (!user.username) {
    location.href = "../index.html";
}

document.getElementById("username").innerText = user.username;

// ===============================
// API
// ===============================
const ACTIVE_URL = "https://ybcdjizonfdhmbxgwdfb.supabase.co/functions/v1/Active_Checker";
const ANSWER_URL = "https://ybcdjizonfdhmbxgwdfb.supabase.co/functions/v1/Answer_Checker";

let serverState = {
    time: { day1: false, day2: false },
    progress: { day1: 1, day2: 1 }
};

// ===============================
// toast error UI
// ===============================
function showError(msg) {
    let el = document.getElementById("toast");
    if (!el) {
        el = document.createElement("div");
        el.id = "toast";
        el.style.position = "fixed";
        el.style.top = "20px";
        el.style.left = "50%";
        el.style.transform = "translateX(-50%)";
        el.style.background = "#ff3b3b";
        el.style.color = "#fff";
        el.style.padding = "10px 16px";
        el.style.borderRadius = "10px";
        el.style.zIndex = "9999";
        document.body.appendChild(el);
    }

    el.innerText = msg;
    el.style.opacity = "1";

    setTimeout(() => {
        el.style.opacity = "0";
    }, 2000);
}

// ===============================
// fetch backend state
// ===============================
async function fetchState() {
    try {
        const res = await fetch(ACTIVE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user.username })
        });

        const json = await res.json();
        if (!json.ok) return;

        serverState.time = json.time;
        serverState.progress = json.progress;

        renderAll();

    } catch (err) {
        console.log("fetchState error:", err);
    }
}

// ===============================
// levels
// ===============================
const day1Levels = Array.from({ length: 7 }, (_, i) => ({
    name: `第${i + 1}關`,
    id: i + 1,
    day: 1
}));

const day2Levels = Array.from({ length: 9 }, (_, i) => ({
    name: `第${i + 8}關`,
    id: i + 8,
    day: 2
}));

// ===============================
// modal state
// ===============================
let currentLevel = null;

function createLevel(container, level) {
    const btn = document.createElement("button");

    btn.innerText = level.name;
    btn.onclick = () => {
        const state = getLevelState(level);
        if (state === "LOCK") return;

        currentLevel = level;
        openModal(level.name);
    };

    container.appendChild(btn);
}

day1Levels.forEach(l => createLevel(document.getElementById("day1"), l));
day2Levels.forEach(l => createLevel(document.getElementById("day2"), l));

// ===============================
// submit answer
// ===============================
async function submitAnswer() {
    const input = document.querySelector(".modal-content input");
    const answer = input.value.trim();

    if (!currentLevel || !answer) return;

    try {
        const res = await fetch(ANSWER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: user.username,
                levelId: currentLevel.id,
                answer
            })
        });

        const json = await res.json();

        if (!json.ok) {
            showError(json.message || "答案錯誤");
            input.value = "";
            return;
        }

        // correct
        location.reload();

    } catch (err) {
        showError("伺服器錯誤");
        input.value = "";
    }
}

// ===============================
// core rule engine
// ===============================
function getLevelState(level) {

    const timeOK = serverState.time[`day${level.day}`];
    const progress = serverState.progress[`day${level.day}`];

    if (!timeOK) return "LOCK";

    let localIndex = level.id;
    if (level.day === 2) localIndex = level.id - 7;

    if (localIndex < progress) return "DONE";
    if (localIndex === progress) return "SOLVE";

    return "LOCK";
}

// ===============================
// render UI
// ===============================
function renderAll() {
    renderGroup("#day1", day1Levels);
    renderGroup("#day2", day2Levels);
    renderHUD();
}

function renderGroup(selector, levels) {
    const buttons = document.querySelectorAll(`${selector} button`);

    buttons.forEach((btn, idx) => {

        const level = levels[idx];
        const state = getLevelState(level);

        btn.disabled = false;
        btn.style.opacity = "1";

        if (state === "LOCK") {
            btn.disabled = true;
            btn.innerText = "🔒 未開放";
            btn.style.opacity = "0.4";
        }

        if (state === "DONE") {
            btn.disabled = true;
            btn.innerText = "✔ 已完成";
            btn.style.opacity = "0.7";
        }

        if (state === "SOLVE") {
            btn.disabled = false;
            btn.innerText = level.name;
        }
    });
}

// ===============================
// HUD
// ===============================
function renderHUD() {
    document.querySelector(".hud").innerHTML = `
        <div>ID: ${user.username}</div>
        <div>Day1：${serverState.time.day1 ? serverState.progress.day1 : "未開放"}/7</div>
        <div>Day2：${serverState.time.day2 ? serverState.progress.day2 : "未開放"}/9</div>
    `;
}

// ===============================
// modal
// ===============================
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");

function openModal(title) {
    modal.style.display = "flex";
    modalTitle.innerText = title;
}

function closeModal() {
    modal.style.display = "none";
}

// ===============================
// logout
// ===============================
function logout() {
    localStorage.removeItem("user");
    location.href = "../index.html";
}

// ===============================
// events
// ===============================
document.getElementById("submitBtn").onclick = submitAnswer;

document.querySelector(".modal-content input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitAnswer();
});

// ===============================
fetchState();

</script>

</body>
</html>
