<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>關卡列表</title>

<style>
:root{
    --bg:#070907;
    --line:#2b442b;
    --green:#6bff4d;
    --text:#f5f5f5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:sans-serif;
    color:var(--text);

    background:
        radial-gradient(circle at top left, rgba(107,255,77,.15), transparent 40%),
        radial-gradient(circle at bottom right, rgba(107,255,77,.1), transparent 40%),
        var(--bg);

    padding:40px;
}

/* HUD */
.hud{
    position:fixed;
    top:20px;
    right:20px;
    background:rgba(15,20,15,.9);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 16px;
    font-size:14px;
}

/* 區塊標題 */
.section-title{
    margin:20px 0 10px;
    font-size:18px;
    color:#cfcfcf;
}

/* grid */
.levels{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:15px;
    margin-bottom:20px;
}

/* button */
button{
    padding:15px;
    font-size:16px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    background:rgba(20,25,20,.9);
    border:1px solid var(--line);
    color:var(--text);
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:var(--green);
    color:#000;
    transform:translateY(-2px);
}

/* divider */
.divider{
    height:1px;
    background:#2b442b;
    margin:30px 0;
}

/* logout */
.logout{
    margin-top:40px;
    width:100%;
    background:#1a1f1a;
}

/* modal */
.modal{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content{
    width:320px;
    background:#101410;
    border:1px solid var(--line);
    padding:20px;
    border-radius:12px;
}

.modal-content h2{
    margin-bottom:15px;
}

.modal-content input{
    width:100%;
    padding:10px;
    margin-top:10px;
    background:#151915;
    border:1px solid #334433;
    color:white;
    border-radius:8px;
}

.modal-content .btn-row{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.small-btn{
    flex:1;
    padding:10px;
    font-size:14px;
}
</style>
</head>

<body>

<!-- HUD -->
<div class="hud">
    <div>ID: <span id="username">---</span></div>
    <div>Day1：0/7</div>
    <div>Day2：0/9</div>
</div>

<h1>關卡選擇</h1>

<!-- DAY 1 -->
<div class="section-title">第一天</div>
<div class="levels" id="day1"></div>

<div class="divider"></div>

<!-- DAY 2 -->
<div class="section-title">第二天</div>
<div class="levels" id="day2"></div>

<!-- 登出 -->
<button class="logout" onclick="logout()">登出</button>

<!-- modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="modalTitle">關卡</h2>

        <button class="small-btn">下載</button>

        <input placeholder="輸入答案">

        <div class="btn-row">
            <button class="small-btn">Enter</button>
            <button class="small-btn" onclick="closeModal()">關閉</button>
        </div>
    </div>
</div>

<script>

// 🔐 user
const user = JSON.parse(localStorage.getItem("user") || "{}");

if(!user.username){
    location.href = "../index.html";
}

document.getElementById("username").innerText = user.username;

// ===============================
// 🌐 Active Checker
// ===============================
const ACTIVE_URL = "https://ybcdjizonfdhmbxgwdfb.supabase.co/functions/v1/Active_Checker";

let dayState = {
    day1: true,
    day2: true
};

async function fetchActiveState(){
    try {
        const res = await fetch(ACTIVE_URL, {
            method: "GET"
        });

        const json = await res.json();

        // backend 回傳 [day1, day2]
        if(json?.result){
            dayState.day1 = json.result[0];
            dayState.day2 = json.result[1];
        }

        applyLevelLock();

    } catch (err) {
        console.log("Active fetch failed:", err);
    }
}

// ===============================
// 🎮 關卡資料
// ===============================
const day1Levels = Array.from({length:7}, (_,i)=>({
    name:`第${i+1}關`,
    id:i+1,
    day:1
}));

const day2Levels = Array.from({length:9}, (_,i)=>({
    name:`第${i+8}關`,
    id:i+8,
    day:2
}));

function createLevel(btnContainer, level){
    const btn = document.createElement("button");
    btn.innerText = level.name;

    btn.dataset.day = level.day;

    btn.onclick = () => {
        if(btn.disabled) return;
        openModal(level.name);
    };

    btnContainer.appendChild(btn);
}

// render
day1Levels.forEach(l => createLevel(document.getElementById("day1"), l));
day2Levels.forEach(l => createLevel(document.getElementById("day2"), l));

// ===============================
// 🔒 套用鎖定狀態
// ===============================
function applyLevelLock(){
    const day1Btns = document.querySelectorAll("#day1 button");
    const day2Btns = document.querySelectorAll("#day2 button");

    lockGroup(day1Btns, dayState.day1, "Day1 未開放");
    lockGroup(day2Btns, dayState.day2, "Day2 未開放");

    updateHUD();
}

function lockGroup(buttons, isActive, label){
    buttons.forEach(btn => {
        if(!isActive){
            btn.disabled = true;
            btn.innerText = "🔒 " + label;
            btn.style.opacity = "0.4";
            btn.style.cursor = "not-allowed";
        }
    });
}

// ===============================
// 📊 HUD 更新
// ===============================
function updateHUD(){
    const day1Total = document.querySelectorAll("#day1 button").length;
    const day2Total = document.querySelectorAll("#day2 button").length;

    document.querySelector(".hud").innerHTML = `
        <div>ID: <span>${user.username}</span></div>
        <div>Day1：${dayState.day1 ? "0" : "未開放"}/${day1Total}</div>
        <div>Day2：${dayState.day2 ? "0" : "未開放"}/${day2Total}</div>
    `;
}

// ===============================
// 📦 modal
// ===============================
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");

function openModal(title){
    modal.style.display = "flex";
    modalTitle.innerText = title;
}

function closeModal(){
    modal.style.display = "none";
}

// ===============================
// 🚪 logout
// ===============================
function logout(){
    localStorage.removeItem("user");
    location.href = "../index.html";
}

// 🚀 init
fetchActiveState();

</script>

</body>
</html>
