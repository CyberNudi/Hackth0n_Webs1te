<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CASE FILES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne+Mono&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
:root {
  --bg:        #08090b;
  --s0:        #0d1110;
  --s1:        #131916;
  --green:     #3dff5a;
  --green-d:   #1a7228;
  --border:    rgba(61,255,90,.11);
  --border-hi: rgba(61,255,90,.28);
  --amber:     #f0a830;
  --blue:      #5ab4ff;
  --red:       #ff4560;
  --text:      #c8e0cc;
  --muted:     #527558;
  --faint:     #1b2b1d;
  --mono:      'Syne Mono', monospace;
  --disp:      'Bebas Neue', sans-serif;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

/* ── BODY ───────────────────────────── */
body {
  min-height: 100vh;
  font-family: var(--mono);
  color: var(--text);
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 65% 32% at 7% 5%,  rgba(61,255,90,.055), transparent 55%),
    radial-gradient(ellipse 50% 28% at 94% 96%, rgba(61,255,90,.035), transparent 55%),
    radial-gradient(circle, rgba(61,255,90,.06) 1px, transparent 1px);
  background-size: auto, auto, 28px 28px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 8000;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(0,0,0,.055) 3px, rgba(0,0,0,.055) 4px
  );
}

/* ── NAVBAR ─────────────────────────── */
.navbar {
  position: sticky; top: 0; z-index: 200;
  display: flex; align-items: center;
  padding: 0 36px; height: 56px; gap: 2px;
  background: rgba(8,9,11,.95);
  border-bottom: 1px solid var(--border-hi);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.nav-logo {
  font-family: var(--disp);
  font-size: 30px; letter-spacing: .1em;
  color: var(--green);
  text-shadow: 0 0 24px rgba(61,255,90,.5);
  margin-right: auto;
}
.nav-sep {
  width: 1px; height: 22px;
  background: var(--border-hi);
  margin: 0 18px; flex-shrink: 0;
}
.nav-stat {
  display: flex; flex-direction: column;
  align-items: flex-end; gap: 2px; flex-shrink: 0;
}
.nav-stat-label { font-size: 9px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
.nav-stat-val   { font-size: 15px; color: var(--green); }
.nav-agent-val  { font-size: 15px; color: var(--text); }

.password-btn{
  padding:4px 10px;
  font-size:11px;
  background:rgba(61,255,90,.05);
  color:var(--green);
  border:1px solid var(--border-hi);
  border-radius:3px;
  cursor:pointer;
}

.password-btn:hover{
  background:rgba(61,255,90,.12);
}
/* ── CONTENT ────────────────────────── */
.content {
  padding: 52px 44px 96px;
  max-width: 1200px; margin: 0 auto;
}

/* ── SECTION CARD ───────────────────── */
.section-card {
  border: 1px solid var(--border);
  border-top: 2px solid rgba(61,255,90,.38);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 20px;
}

/* main line: green top */
.section-card.day { border-top-color: rgba(61,255,90,.38); }

/* side missions: amber top */
.section-card.side { border-top-color: rgba(240,168,48,.42); }
.section-card.side .section-num { color: rgba(240,168,48,.1); }
.section-card.side .section-sub { color: rgba(240,168,48,.5); }

/* evidence: blue top */
.section-card.evidence { border-top-color: rgba(90,180,255,.35); }
.section-card.evidence .section-num { color: rgba(90,180,255,.1); }
.section-card.evidence .section-sub { color: rgba(90,180,255,.45); }

.section-header {
  display: flex; align-items: center;
  gap: 20px; padding: 18px 22px 16px;
  background: rgba(61,255,90,.02);
  border-bottom: 1px solid var(--border);
}
.section-card.side .section-header     { background: rgba(240,168,48,.015); }
.section-card.evidence .section-header { background: rgba(90,180,255,.015); }

.section-num {
  font-family: var(--disp);
  font-size: 64px; line-height: 1;
  color: rgba(61,255,90,.1);
  letter-spacing: .04em;
  flex-shrink: 0; user-select: none;
}
.section-meta { display: flex; flex-direction: column; gap: 4px; }
.section-name {
  font-family: var(--disp);
  font-size: 44px; letter-spacing: .08em;
  color: var(--text); line-height: 1;
}
.section-sub {
  font-size: 11px; letter-spacing: .2em;
  color: var(--muted); text-transform: uppercase;
}

/* ── LEVEL GRID ──────────────────────── */
.levels {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: 8px;
  padding: 14px;
  background: rgba(0,0,0,.18);
}

/* ── BUTTONS ────────────────────────── */
button {
  font-family: var(--mono);
  font-size: 15px; letter-spacing: .04em;
  padding: 16px 14px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--s0); color: var(--text);
  cursor: pointer; text-align: left;
  position: relative; overflow: hidden;
  transition: border-color .12s, background .12s, color .12s,
              transform .1s, box-shadow .12s;
}
button::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 2px; height: 100%;
  background: var(--green-d);
  transition: background .12s, box-shadow .12s;
}
button:hover:not(:disabled) {
  border-color: var(--border-hi); background: var(--s1); color: var(--green);
  transform: translateX(3px);
}
button:hover:not(:disabled)::before {
  background: var(--green); box-shadow: 0 0 7px var(--green);
}
button:disabled { cursor: default; }

button.done-btn {
  border-color: rgba(61,255,90,.18);
  background: rgba(61,255,90,.03); color: var(--muted);
}
button.done-btn::before { background: rgba(61,255,90,.4); }
button.done-btn:hover:not(:disabled) {
  border-color: var(--border-hi); color: var(--green);
  background: rgba(61,255,90,.06); transform: translateX(3px);
}
button.done-btn:hover:not(:disabled)::before {
  background: var(--green); box-shadow: 0 0 7px var(--green);
}

/* ── LOGOUT ─────────────────────────── */
.logout-row {
  margin-top: 56px; padding-top: 20px;
  border-top: 1px solid var(--faint);
}
.logout {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: .2em; color: var(--muted);
  background: transparent;
  border: 1px solid rgba(255,69,96,.2); border-radius: 3px;
  padding: 10px 18px; cursor: pointer;
  text-transform: uppercase;
  transition: color .18s, border-color .18s, background .18s;
}
.logout::before { content: none; }
.logout:hover:not(:disabled) {
  color: var(--red); border-color: var(--red);
  background: rgba(255,69,96,.05);
  transform: none; box-shadow: none;
}

/* ── MODAL ──────────────────────────── */
.modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.74);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: none; justify-content: center; align-items: center;
  z-index: 1000;
}
.modal-content {
  width: min(400px, 92vw);
  background: var(--s0);
  border: 1px solid var(--border-hi); border-radius: 4px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(61,255,90,.05),
              0 0 50px rgba(61,255,90,.07),
              0 36px 80px rgba(0,0,0,.85);
}
.modal-chrome {
  display: flex; align-items: center;
  padding: 10px 16px; gap: 8px;
  border-bottom: 1px solid var(--border);
  background: rgba(61,255,90,.025);
}
.modal-chrome-label {
  font-size: 9px; letter-spacing: .24em; color: var(--muted);
  text-transform: uppercase; flex: 1;
}
.modal-chrome-label::before { content: '// '; color: var(--green-d); }
.modal-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 6px var(--green);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

.modal-title-area { padding: 16px 16px 2px; }
#modalTitle {
  font-family: var(--disp); font-size: 38px;
  letter-spacing: .1em; color: var(--green); line-height: 1;
}
.modal-body { padding: 4px 16px 16px; }
.modal-description {
  min-height: 72px; max-height: 200px; overflow-y: auto;
  margin: 12px 0; padding: 10px 12px;
  border: 1px solid var(--faint); border-radius: 3px;
  background: var(--bg); color: var(--text);
  line-height: 1.85; font-size: 13px; white-space: pre-wrap;
}
.modal-description::-webkit-scrollbar { width: 3px; }
.modal-description::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

#downloadBtn {
  width: 100%; margin-bottom: 8px; padding: 10px;
  background: rgba(61,255,90,.05); border-color: rgba(61,255,90,.28);
  color: var(--green); font-size: 12px; letter-spacing: .12em;
  text-align: center; text-transform: uppercase;
}
#downloadBtn::before { content: none; }
#downloadBtn:hover:not(:disabled) {
  background: rgba(61,255,90,.1); border-color: var(--green);
  color: var(--green); transform: none; box-shadow: 0 0 14px rgba(61,255,90,.1);
}

.modal-content input {
  width: 100%; padding: 11px 12px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
  color: var(--text); font-family: var(--mono); font-size: 15px;
  letter-spacing: .04em; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.modal-content input::placeholder { color: var(--faint); }
.modal-content input:focus {
  border-color: rgba(61,255,90,.5);
  box-shadow: 0 0 0 3px rgba(61,255,90,.08);
}

.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.small-btn {
  flex: 1; padding: 11px 8px;
  font-family: var(--mono); font-size: 12px;
  letter-spacing: .14em; text-align: center;
  border-radius: 3px; text-transform: uppercase;
}
#submitBtn {
  background: var(--green); color: #050a06;
  border-color: var(--green); font-weight: bold;
}
#submitBtn::before { content: none; }
#submitBtn:hover:not(:disabled) {
  background: #55ff6e; border-color: #55ff6e; color: #050a06;
  transform: none; box-shadow: 0 4px 20px rgba(61,255,90,.22);
}
#submitBtn:disabled { opacity: .5; }
.btn-close {
  background: transparent; border-color: var(--faint); color: var(--muted);
}
.btn-close::before { content: none; }
.btn-close:hover:not(:disabled) {
  border-color: var(--muted); color: var(--text);
  background: rgba(255,255,255,.02); transform: none; box-shadow: none;
}

/* ── RESPONSIVE ─────────────────────── */
@media (max-width: 640px) {
  .content { padding: 32px 16px 64px; }
  .navbar  { padding: 0 16px; }
  .nav-sep { margin: 0 10px; }
  .section-name { font-size: 34px; }
  .section-num  { font-size: 48px; }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="nav-logo">CASE FILES</div>
  <div class="nav-stat">
    <span class="nav-stat-label">Agent</span>
    <span class="nav-agent-val" id="username">---</span>
  </div>
  
  <div class="nav-sep"></div>
  
  <div class="nav-stat">
    <span class="nav-stat-label">Password</span>
    <button id="showPasswordBtn" class="password-btn">
        View
    </button>
  </div>
  <div class="nav-sep"></div>
  <div class="nav-stat">
    <span class="nav-stat-label">Score</span>
    <span class="nav-stat-val" id="hud-score">---</span>
  </div>
  <div class="nav-sep"></div>
  <div class="nav-stat">
    <span class="nav-stat-label">Day 1</span>
    <span class="nav-stat-val" id="hud-day1">---</span>
  </div>
  <div class="nav-sep"></div>
  <div class="nav-stat">
    <span class="nav-stat-label">Day 2</span>
    <span class="nav-stat-val" id="hud-day2">---</span>
  </div>
</nav>

<main class="content">

  <div class="section-card day">
    <div class="section-header">
      <span class="section-num">01</span>
      <div class="section-meta">
        <div class="section-name">第一天</div>
        <div class="section-sub">Day 1 · Field Operations</div>
      </div>
    </div>
    <div class="levels" id="day1"></div>
  </div>

  <div class="section-card day">
    <div class="section-header">
      <span class="section-num">02</span>
      <div class="section-meta">
        <div class="section-name">第二天</div>
        <div class="section-sub">Day 2 · Deep Cover</div>
      </div>
    </div>
    <div class="levels" id="day2"></div>
  </div>

  <div class="section-card side">
    <div class="section-header">
      <span class="section-num">03</span>
      <div class="section-meta">
        <div class="section-name">支線任務</div>
        <div class="section-sub">Side Missions · Optional</div>
      </div>
    </div>
    <div class="levels" id="sidequests"></div>
  </div>

  <div class="section-card evidence">
    <div class="section-header">
      <span class="section-num">04</span>
      <div class="section-meta">
        <div class="section-name">蛛絲馬跡</div>
        <div class="section-sub">Evidence · Hidden Clues</div>
      </div>
    </div>
    <div class="levels" id="findings"></div>
  </div>

  <div class="logout-row">
    <button class="logout" onclick="logout()">⎋ logout</button>
  </div>

</main>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-chrome">
      <span class="modal-chrome-label">Encrypted Channel</span>
      <span class="modal-dot"></span>
    </div>
    <div class="modal-title-area">
      <h2 id="modalTitle">關卡</h2>
    </div>
    <div class="modal-body">
      <div id="modalDescription" class="modal-description">說明內容</div>
      <button id="downloadBtn" class="small-btn" style="display:none;">⬇ 下載謎題</button>
      <input id="modalInput" placeholder="輸入答案">
      <div class="btn-row">
        <button id="submitBtn" class="small-btn">Submit</button>
        <button class="small-btn btn-close" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>
</div>

<script>

const user = JSON.parse(localStorage.getItem("user") || "{}");

if (!user.username) {
    location.href = "../index.html";
}

document.getElementById("username").innerText = user.username;

// ===============================
// API
// ===============================
const ACTIVE_URL = "https://ybcdjizonfdhmbxgwdfb.supabase.co/functions/v1/Active_Checker";
const ANSWER_URL = "https://ybcdjizonfdhmbxgwdfb.supabase.co/functions/v1/Answer_Checker";

let serverState = {
    time: { day1: false, day2: false },
    progress: { day1: 1, day2: 1, side: 0 },
    score: 0,
    password: ""
};

// ===============================
// ── 加新關卡只需改這裡 ──────────────────
// ===============================
const DAY1_COUNT = 7;
const DAY2_COUNT = 9;

const GAS_DOWNLOAD_URL = "https://script.google.com/macros/s/AKfycbw4nER0Cqjbsd7VkaIR1ymdG-0ubALRK9C4kr4JogW60BqtazLBuAPTkFplPeXH3_DL/exec";
const PUZZLE_CONFIG = {
    1:  "1lw_hfqBiwkp7Hm9kSeCE2A_9eZvk4nh7",
    2:  "1N3rSYD2XceD72Me9Z8MFOsalNan-v_Pl",
    3:  "1Hx0EcUp_ngjOsY65X9IvY_CpRoc0-Ers",
    4:  "1btsLuEhax3qZeZudrXuIHFl1cmw17R4s",
    5:  "1ZWLIy1xqTvCW0mvXQOA6q45fFqzf11ow",
    6:  "1AOluloVVuyFTHtfyYscKamyy2JI9BiRm",
    7:  "1IKq2Q30a-MpnAqPvsPhBOdDo0vr8iNKt",
    8:  "15m9lX3RkeWegkQgJNFJo2UUFAcpX09If",
    9:  "1WGvu_u5tPRdTbPtU_loJJnM_9nH9myPQ",
    10: "1lGor2q4xjmsPrr3sZZb_2H1TOwanSzfP",
    11: "1Xso2I8J1okFQ80puLXTWott2Ah36AINO",
    12: "17-BVeJFVqKSm7igrdakVRcs_bCntk1Qb",
    13: "1mM_-2K3yXNGUgkKEqGd0EU4bncJzUKB9",
    14: "11vtzN9uPoY0gqz6GlUFnXJ5ZKh4dKyRz",
    15: "1lSN0y8D-quXm1GiVCIwU4-L4RhzscR-c",
    16: "1X1TefpVfbixYfcCIbjv0KocKk16ywDJc"
};

const day1Levels = Array.from({ length: DAY1_COUNT }, (_, i) => ({
    name: `第${i + 1}關`,
    id: i + 1,
    day: 1
}));

const day2Levels = Array.from({ length: DAY2_COUNT }, (_, i) => ({
    name: `第${i + 8}關`,
    id: i + 8,
    day: 2
}));

const sideQuestLevels = [
    { id: 17, name: "A", description: "找出當初醫生的檔案備份位置。\n難度：★" },
    { id: 18, name: "B", description: "追蹤那些被誤導者的足跡。\n難度：★★" },
    { id: 19, name: "C", description: "那是一隻會很長壽的鹿。\n難度：★" },
    { id: 20, name: "D", description: "你好，研究人—痾不對，我的意思是|渡鴉|。\n難度：★" },
    { id: 21, name: "E", description: "那是世界的中心，就在這兩天中的精華之處。\n難度：★★★" }
];

const findingLevels = [
    { id: 22, name: "甲", description: "我可能曾經到過森林，並在最顯眼之處留下了足跡。" },
    { id: 23, name: "乙", description: "找到我的線人，他可能就在路上了。" },
    { id: 24, name: "丙", description: "我那時手頭拮据，於是便將這份線索賣給了—" }
];
// ───────────────────────────────────────

// ===============================
function showError(msg) {
    let el = document.getElementById("toast");
    if (!el) {
        el = document.createElement("div");
        el.id = "toast";
        el.style.cssText = "position:fixed;top:20px;left:50%;transform:translateX(-50%);" +
            "background:#ff4560;color:#fff;padding:10px 18px;border-radius:4px;" +
            "font-family:'Syne Mono',monospace;font-size:13px;letter-spacing:.06em;" +
            "z-index:9999;transition:opacity .3s;";
        document.body.appendChild(el);
    }
    el.innerText = msg;
    el.style.opacity = "1";
    setTimeout(() => { el.style.opacity = "0"; }, 2000);
}

// ===============================
// fetch state
// ===============================
async function fetchState() {
    try {
        const res = await fetch(ACTIVE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: user.username })
        });

        const json = await res.json();
        if (!json.ok) return;

        serverState.time = json.time;
        serverState.progress = json.progress;
        serverState.progress.side = json.progress.side ?? 0;
        serverState.score = json.score ?? 0;
        serverState.password = json.password ?? "";

        renderAll();

    } catch (err) {
        console.log("fetchState error:", err);
    }
}

let currentLevel = null;

// ===============================
// 初始化建立按鈕 (DOM 產生)
// ===============================
function initButtons() {
    day1Levels.forEach(l => createMainLevelBtn(document.getElementById("day1"), l));
    day2Levels.forEach(l => createMainLevelBtn(document.getElementById("day2"), l));
    sideQuestLevels.forEach(l => createBitmaskLevelBtn(document.getElementById("sidequests"), l));
    findingLevels.forEach(l => createBitmaskLevelBtn(document.getElementById("findings"), l));
}

function createMainLevelBtn(container, level) {
    const btn = document.createElement("button");
    btn.innerText = level.name;
    btn.onclick = () => {
        const state = getLevelState(level);
        if (state === "LOCK") return;
        currentLevel = level;
        openModal(level.name, level.id);
    };
    container.appendChild(btn);
}

function createBitmaskLevelBtn(container, level) {
    const btn = document.createElement("button");
    btn.innerText = level.name;
    btn.onclick = () => {
        openTaskModal(level.name, level.description, level.id);
    };
    container.appendChild(btn);
}

// ===============================
// 答案提交
// ===============================
async function submitAnswer() {
    const input = document.getElementById("modalInput");
    const btn = document.getElementById("submitBtn");
    const answer = input.value.trim();

    if (!currentLevel || !answer) return;

    btn.disabled = true;
    btn.innerText = "...";

    try {
        const res = await fetch(ANSWER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: user.username,
                levelId: currentLevel.id,
                answer
            })
        });

        const json = await res.json();

        if (!json.ok) {
            showError(json.message || "答案錯誤");
            input.value = "";
            return;
        }

        location.reload();

    } catch (err) {
        showError("伺服器錯誤");
    } finally {
        btn.disabled = false;
        btn.innerText = "Submit";
    }
}

// ===============================
// 取得主線狀態
// ===============================
function getLevelState(level) {
    const timeOK = serverState.time[`day${level.day}`];
    const progress = serverState.progress[`day${level.day}`];

    if (!timeOK) return "LOCK";

    let localIndex = level.id;
    if (level.day === 2) localIndex = level.id - 7;

    if (localIndex < progress) return "DONE";
    if (localIndex === progress) return "SOLVE";

    return "LOCK";
}

// ===============================
// 畫面上色與文字狀態更新
// ===============================
function renderAll() {
    renderMainGroup("#day1", day1Levels);
    renderMainGroup("#day2", day2Levels);
    renderBitmaskGroup("#sidequests", sideQuestLevels);
    renderBitmaskGroup("#findings", findingLevels);
    renderHUD();
}

// 渲染主線 (線性推進)
function renderMainGroup(selector, levels) {
    const buttons = document.querySelectorAll(`${selector} button`);

    buttons.forEach((btn, idx) => {
        const level = levels[idx];
        const state = getLevelState(level);

        btn.disabled = false;
        btn.classList.remove("done-btn");
        btn.style.opacity = "1";

        if (state === "LOCK") {
            btn.disabled = true;
            btn.innerText = "🔒 未開放";
            btn.style.opacity = "0.4";
        }

        if (state === "DONE") {
            btn.disabled = false;
            btn.innerText = `✔ ${level.name}`;
            btn.style.opacity = "0.85";
            btn.classList.add("done-btn");
        
            // 讓已完成關卡仍然可點
            btn.onclick = () => {
                currentLevel = level;
                openModal(level.name, level.id , "review");
        
                // 強制進入「回顧模式」
                document.getElementById("modalInput").style.display = "none";
                document.getElementById("submitBtn").style.display = "none";
            };
        }

        if (state === "SOLVE") {
            btn.disabled = false;
            btn.innerText = level.name;
        }
    });
}

// 渲染支線與足跡 (Bitmask 判定)
function renderBitmaskGroup(selector, levels) {
    const buttons = document.querySelectorAll(`${selector} button`);
    const sideMask = serverState.progress.side;

    buttons.forEach((btn, idx) => {
        const level = levels[idx];
        const levelBit = 1 << (level.id - 17);
        const isDone = (sideMask & levelBit) !== 0;

        if (isDone) {
            btn.innerText = `✔ ${level.name} (已完成)`;
            btn.classList.add("done-btn");
            // 讓已完成關卡仍然可點
            btn.onclick = () => {
                currentLevel = level;
                openTaskModal(level.name, level.description,level.id , "review");
        
                // 強制進入「回顧模式」
                document.getElementById("modalInput").style.display = "none";
                document.getElementById("submitBtn").style.display = "none";
            };
        } else {
            btn.innerText = level.name;
            btn.classList.remove("done-btn");
        }
    });
}

// 渲染 HUD 頂部狀態列
function renderHUD() {
    document.getElementById("hud-score").innerText = serverState.score;
    document.getElementById("hud-day1").innerText = serverState.time.day1
        ? `${serverState.progress.day1 - 1}/${DAY1_COUNT}`
        : "未開放";
    document.getElementById("hud-day2").innerText = serverState.time.day2
        ? `${serverState.progress.day2 - 1}/${DAY2_COUNT}`
        : "未開放";
}

// ===============================
// 彈窗 Modal 控制
// ===============================
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalDescription = document.getElementById("modalDescription");

function openModal(title, levelId, mode = "play") {
    modal.style.display = "flex";
    modalTitle.innerText = title;

    document.getElementById("modalInput").value = "";

    const input = document.getElementById("modalInput");
    const submit = document.getElementById("submitBtn");
    const dlBtn = document.getElementById("downloadBtn");

    // reset
    input.style.display = "";
    submit.style.display = "";
    dlBtn.style.display = "none";

    if (mode === "review") {
        input.style.display = "none";
        submit.style.display = "none";
        modalDescription.innerText = "✔ 已完成關卡（可重新查看內容與下載）";
    } else {
        modalDescription.innerText = "請輸入本關卡答案。";
    }

    const folderId = PUZZLE_CONFIG[levelId];
    if (folderId) {
        dlBtn.style.display = "";
        dlBtn.onclick = () => window.open(`${GAS_DOWNLOAD_URL}?id=${folderId}`, "_blank");
    }
}

function openTaskModal(title, description, id, mode = "play") {
    const input = document.getElementById("modalInput");
    const submit = document.getElementById("submitBtn");
    const dlBtn = document.getElementById("downloadBtn");

    // reset
    input.style.display = "";
    submit.style.display = "";
    dlBtn.style.display = "none";
  
    modal.style.display = "flex";
    modalTitle.innerText = title;
    if (mode === "review") {
        input.style.display = "none";
        submit.style.display = "none";
        modalDescription.innerText = "✔ 已完成關卡（可重新查看內容與下載）\n" + description;
    } else {
        modalDescription.innerText = description;
    }

    currentLevel = { id, type: "side" };
}

function closeModal() {
    modal.style.display = "none";
}
//==================
// 密碼顯示
//==================
function openPasswordModal() {
    if (!serverState.password) {
        showError("無法取得密碼");
        return;
    }

    modal.style.display = "flex";

    modalTitle.innerText = "Agent Credentials";

    modalDescription.innerText =
        `帳號：${user.username}\n密碼：${serverState.password}`;

    document.getElementById("modalInput").style.display = "none";
    document.getElementById("submitBtn").style.display = "none";
    document.getElementById("downloadBtn").style.display = "none";

    // 加一個關閉按鈕保險（避免 UX 卡死）
    let closeBtn = document.getElementById("passwordCloseBtn");

    if (!closeBtn) {
        closeBtn = document.createElement("button");
        closeBtn.id = "passwordCloseBtn";
        closeBtn.className = "small-btn btn-close";
        closeBtn.innerText = "Close";
        closeBtn.onclick = () => {
            document.getElementById("modalInput").style.display = "";
            document.getElementById("submitBtn").style.display = "";
            closeModal();
        };

        document.querySelector(".btn-row").appendChild(closeBtn);
    }
}
// ===============================
// 登出與事件繫結
// ===============================
function logout() {
    localStorage.removeItem("user");
    location.href = "../index.html";
}

document.getElementById("submitBtn").onclick = submitAnswer;

document.getElementById("modalInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitAnswer();
});
  
document.getElementById("showPasswordBtn").addEventListener("click", () => {

    if(!serverState.password){
        showError("無法取得密碼");
        return;
    }

    openPasswordModal();
});
// 執行初始化與載入
initButtons();
fetchState();
