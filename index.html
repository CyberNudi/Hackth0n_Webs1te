<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>

<style>
:root{
    --bg:#070907;
    --card:#101410;
    --line:#2b442b;
    --green:#6bff4d;
    --text:#f5f5f5;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    background:
        radial-gradient(circle at top left, rgba(107,255,77,.15), transparent 40%),
        radial-gradient(circle at bottom right, rgba(107,255,77,.1), transparent 40%),
        #070907;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:sans-serif;
    color:white;
}

.login-box{
    width:360px;
    padding:35px;
    border-radius:18px;
    background:rgba(15,20,15,.9);
    border:1px solid var(--line);
    backdrop-filter:blur(8px);
    box-shadow:0 0 30px rgba(0,0,0,.4);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    background:#151915;
    border:1px solid #334433;
    border-radius:10px;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    background:var(--green);
    cursor:pointer;
}

button:hover{
    filter:brightness(1.1);
}

#result{
    margin-top:15px;
    text-align:center;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>

    <p id="result"></p>
</div>

<script>

const LOGIN_API =
    "https://ybcdjizonfdhmbxgwdfb.supabase.co/functions/v1/Login_Auth";

document.getElementById("loginBtn").onclick = async () => {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const result = document.getElementById("result");

    result.innerText = "Checking...";

    try {

        const res = await fetch(LOGIN_API, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        // 成功登入
        if (data.ok === true) {

            localStorage.setItem("user", JSON.stringify(data));

            location.href = "./Levels.html";

            return;
        }

        // 失敗
        result.innerText = data.error || "Login failed";
        result.style.color = "#ff6060";

    } catch (err) {

        result.innerText = "Network error";
        result.style.color = "#ff6060";
    }
};

</script>

</body>
</html>
